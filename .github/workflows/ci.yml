name: CI

on:
  workflow_dispatch:
  push:
    branches: [2.3.x, 2.7.x, 3.0.x, 3.1.x, 3.2.x, 3.3.x, 3.4.x, 3.5.x, 4.0.x, 4.1.x, fix/disruptor-string-utils-3.4.x]
  pull_request:
    branches: [2.3.x, 2.7.x, 3.0.x, 3.1.x, 3.2.x, 3.3.x, 3.4.x, 3.5.x, 4.0.x, 4.1.x]

permissions:
  contents: read

jobs:
  build:
    uses: easy-4-java/.github/.github/workflows/maven-starter-ci.yml@bf473d6e9490345a8ac2abeb895639f87448c7ff
    with:
      version-line: ${{ github.ref_name == 'fix/disruptor-string-utils-3.4.x' && '3.4.x' || '' }}
    secrets: inherit
