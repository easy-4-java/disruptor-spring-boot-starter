name: CI main Boot 2.6

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout starter
        uses: actions/checkout@v4
        with:
          path: starter
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - name: Checkout matching Disruptor extension
        uses: actions/checkout@v4
        with:
          repository: easy-4-java/disruptor-extension
          ref: e9f81a75c8b4c8316dde4e4f852a092bffe59179
          path: disruptor-extension-source
      - name: Install matching extension snapshot
        working-directory: disruptor-extension-source
        run: mvn -B --no-transfer-progress clean install
      - name: Verify Boot 2.6 starter
        working-directory: starter
        run: mvn -B --no-transfer-progress clean verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot26-test-reports
          path: starter/target/surefire-reports
          if-no-files-found: ignore
